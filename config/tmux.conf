# ide layout: editor left (pane 1), harness A top-right (pane 2),
# harness B bottom-right (pane 3). Mouse click focuses any pane.
set -g mouse on
set -g focus-events on
set -g pane-border-status top
set -g pane-border-format ' #{pane_title} [#{pane_current_command}] '

# vim-style directional switching WITH prefix (works from opencode/omp panes too)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# direct jumps WITH prefix: Shift+N/E/O (no clash with defaults n/o/e)
# panes are 1/2/3 because pane-base-index is 1 below:
# 1 = editor left, 2 = harness A top-right, 3 = harness B bottom-right
bind N select-pane -t 1
bind E select-pane -t 2
bind O select-pane -t 3

# toggle mouse mode WITH prefix (click/drag/scroll panes)
bind m run-shell "$HOME/.local/bin/ide-mouse"

# same moves WITHOUT prefix via Alt+hjkl (enable "Use Option as Meta" in macOS Terminal)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# keep windows/panes numbered from 1 like most IDE setups
set -g base-index 1
set -g pane-base-index 1
